<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DesInspect</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>

<header class="toolbar">
  <button id="btn-pick" class="tb-btn" title="Inspect an element on the page (Pick mode)">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <path d="M3 3l8 18 2.4-7.6L21 11 3 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span>Pick</span>
  </button>
  <div class="tb-divider"></div>
  <button id="btn-undo" class="tb-btn icon-btn" title="Undo (⌘Z)" disabled>↺</button>
  <button id="btn-redo" class="tb-btn icon-btn" title="Redo (⌘⇧Z)" disabled>↻</button>
  <div class="tb-divider"></div>
  <span id="status" class="tb-status">No element selected</span>
  <div class="tb-spacer"></div>
  <button id="btn-snapshot" class="tb-btn" title="Create snapshot">⌥ Snapshot</button>
  <button id="btn-clear" class="tb-btn danger" title="Revert all edits on this page">Revert all</button>
</header>

<main class="layout">

  <!-- DOM tree pane -->
  <section class="pane pane-tree">
    <div class="pane-header">
      <span>Elements</span>
      <button id="btn-refresh-tree" class="link-btn" title="Refresh DOM tree">refresh</button>
    </div>
    <div id="tree" class="tree" role="tree" tabindex="0">
      <div class="tree-empty">Click <strong>Pick</strong> or expand the tree.</div>
    </div>
  </section>

  <!-- Resizer -->
  <div class="resizer" id="resizer" aria-hidden="true"></div>

  <!-- Inspector pane -->
  <section class="pane pane-inspector">
    <div class="tabs" role="tablist">
      <button data-tab="styles" class="tab active" role="tab" aria-selected="true">Styles</button>
      <button data-tab="computed" class="tab" role="tab">Computed</button>
      <button data-tab="changes" class="tab" role="tab">Changes <span id="changes-badge" class="badge"></span></button>
      <button data-tab="snapshots" class="tab" role="tab">Snapshots</button>
    </div>

    <div class="tab-panels">
      <div class="tab-panel active" data-panel="styles">
        <div class="filter-row">
          <input id="style-filter" type="text" placeholder="Filter properties" />
          <button id="btn-add-rule" class="link-btn">+ New rule</button>
        </div>
        <div id="styles" class="styles-list">
          <div class="empty">Select an element to view its styles.</div>
        </div>
      </div>

      <div class="tab-panel" data-panel="computed">
        <div id="box" class="box-wrap">
          <div class="empty">No selection.</div>
        </div>
        <div class="filter-row">
          <input id="computed-filter" type="text" placeholder="Filter" />
          <label class="check"><input id="computed-show-all" type="checkbox" /> show all</label>
        </div>
        <div id="computed" class="computed-list">
          <div class="empty">No selection.</div>
        </div>
      </div>

      <div class="tab-panel" data-panel="changes">
        <div id="changes" class="changes-list">
          <div class="empty">No persisted edits yet.</div>
        </div>
      </div>

      <div class="tab-panel" data-panel="snapshots">
        <div class="filter-row">
          <input id="snapshot-name" type="text" placeholder="Snapshot name" />
          <button id="btn-create-snapshot" class="link-btn primary">Save</button>
        </div>
        <div id="snapshots" class="snapshots-list">
          <div class="empty">No snapshots saved.</div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="panel.js"></script>
</body>
</html>
